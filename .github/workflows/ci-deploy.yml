name: CI → Deploy — Talpro India

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type Check → Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify native runtime bindings
        run: node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.prepare('SELECT 1').get(); db.close();"

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  deploy:
    name: Deploy to Production
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, talpro-india-deploy]
    timeout-minutes: 60
    environment: production

    steps:
      - name: Deploy Talpro India on BHISHMA
        shell: bash
        run: |
          set -euo pipefail

          APP_LINK="/opt/talpro-india"
          RELEASE_ROOT="/var/www/talpro/releases"
          STABLE_ENV_DIR="/etc/talpro-india"
          STABLE_ENV="${STABLE_ENV_DIR}/talpro-india.env"
          LEGACY_ENV="${APP_LINK}/.env"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BUILD_DIR="/tmp/talpro-india-github-${SHORT_SHA}"
          STAGED_ENV="/tmp/talpro-india-env-${SHORT_SHA}"
          RELEASE_DIR="${RELEASE_ROOT}/${STAMP}-${SHORT_SHA}"
          PREVIOUS_RELEASE="$(readlink -f "$APP_LINK" || true)"

          cleanup() {
            rm -rf "$BUILD_DIR"
            rm -f "$STAGED_ENV"
          }

          rollback() {
            reason="$1"
            echo "Deployment failed: ${reason}; rolling back to ${PREVIOUS_RELEASE}" >&2
            set +e
            install -o root -g root -m 600 "$STABLE_ENV" "${PREVIOUS_RELEASE}/.env"
            ln -sfn "$PREVIOUS_RELEASE" /var/www/talpro/current
            ln -sfn "$PREVIOUS_RELEASE" "$APP_LINK"
            systemctl restart talpro-india.service
            sleep 5

            rollback_ok=0
            systemctl is-active --quiet talpro-india.service || rollback_ok=1
            curl -fsS --max-time 10 http://127.0.0.1:3001/api/health >/dev/null || rollback_ok=1

            if [ "$rollback_ok" -eq 0 ]; then
              echo "Rollback succeeded; previous Talpro release is healthy" >&2
            else
              echo "Rollback failed health verification; Talpro requires incident response" >&2
            fi
            exit 1
          }

          trap cleanup EXIT

          if [ -z "$PREVIOUS_RELEASE" ] || [ ! -d "$PREVIOUS_RELEASE" ]; then
            echo "Current Talpro release is unavailable; refusing deployment" >&2
            exit 1
          fi

          install -d -o root -g root -m 700 "$STABLE_ENV_DIR"
          if [ ! -s "$STABLE_ENV" ]; then
            if [ ! -s "$LEGACY_ENV" ]; then
              echo "Talpro runtime environment is missing; refusing deployment" >&2
              exit 1
            fi
            install -o root -g root -m 600 "$LEGACY_ENV" "$STABLE_ENV"
          fi
          install -o root -g root -m 600 "$STABLE_ENV" "$STAGED_ENV"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR" "$RELEASE_ROOT"

          rsync -a --delete \
            --exclude node_modules \
            --exclude dist \
            --exclude .cache \
            --exclude /.env \
            "${APP_LINK}/" "$BUILD_DIR/"

          cd "$BUILD_DIR"
          git fetch origin main
          git checkout -f "$SHA"
          git reset --hard "$SHA"
          install -o root -g root -m 600 "$STAGED_ENV" "$BUILD_DIR/.env"

          npm ci
          node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.prepare('SELECT 1').get(); db.close();"
          npm run build
          npm run prerender

          route_count="$(find dist/public -name index.html | wc -l | tr -d ' ')"
          if [ "$route_count" -lt 1000 ]; then
            echo "Expected at least 1000 prerendered routes, found ${route_count}" >&2
            exit 1
          fi

          rsync -a --delete "$BUILD_DIR/" "$RELEASE_DIR/"
          test -s "$RELEASE_DIR/.env"
          test "$(stat -c '%U:%G:%a' "$RELEASE_DIR/.env")" = "root:root:600"
          (
            cd "$RELEASE_DIR"
            node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.prepare('SELECT 1').get(); db.close();"
          )

          ln -sfn "$RELEASE_DIR" /var/www/talpro/current
          ln -sfn "$RELEASE_DIR" "$APP_LINK"

          if ! systemctl restart talpro-india.service; then
            rollback "service restart command failed"
          fi
          sleep 5

          if ! systemctl is-active --quiet talpro-india.service; then
            rollback "service did not remain active"
          fi
          if ! curl -fsS --max-time 10 http://127.0.0.1:3001/api/health >/dev/null; then
            rollback "internal health check failed"
          fi

          test "$(find "${APP_LINK}/dist/public" -name index.html | wc -l | tr -d ' ')" -ge 1000
          grep -q "Hire React Developer" "${APP_LINK}/dist/public/hire/react-developer/index.html"
          echo "Talpro India deployed ${SHORT_SHA} with ${route_count} prerendered routes"
